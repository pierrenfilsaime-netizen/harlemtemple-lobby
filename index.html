<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harlem Temple Lobby</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;1,9..144,500&family=Archivo:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#13203B; --navy2:#1C2D52; --red:#D3242C; --red-deep:#9E1A20;
    --gold:#F2B634; --cream:#F7F0E3; --cream2:#EFE3CC; --ink:#1B1B1F;
    /* one unit = 1% of a 16:9 frame, so the layout scales on any screen */
    --u: min(1vw, 1.7778vh);
    --serif: "Fraunces", Georgia, "Times New Roman", serif;
    --sans: "Archivo", "Segoe UI", Roboto, Arial, sans-serif;
    --l3h: calc(var(--u) * 14.2);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--navy);color:var(--ink);font-family:var(--sans)}
  body.idle{cursor:none}

  /* ============ SLIDES ============ */
  #stage{position:fixed;inset:0;overflow:hidden;background:var(--navy)}
  .slide{position:absolute;inset:0;opacity:0;transition:opacity 1.1s ease}
  .slide.on{opacity:1}
  .slide.off{opacity:0}

  /* safe content area above the lower third */
  .pad{position:absolute;inset:0;padding:calc(var(--u)*6) calc(var(--u)*7) calc(var(--l3h) + var(--u)*4.5);display:flex;flex-direction:column;justify-content:center}

  .kicker{display:inline-flex;align-items:center;gap:calc(var(--u)*1.2);font:800 calc(var(--u)*1.35)/1 var(--sans);letter-spacing:.22em;text-transform:uppercase;color:var(--red);margin-bottom:calc(var(--u)*2)}
  .kicker::before{content:"";width:calc(var(--u)*4);height:calc(var(--u)*.35);background:var(--gold);border-radius:9px}
  .title{font:700 calc(var(--u)*6.6)/1.02 var(--serif);letter-spacing:-.015em;max-width:calc(var(--u)*72);text-wrap:balance}
  .body{font:400 calc(var(--u)*2.15)/1.45 var(--sans);max-width:calc(var(--u)*58);margin-top:calc(var(--u)*2.4);opacity:.9;text-wrap:pretty}

  /* text slide themes */
  .t-cream{background:radial-gradient(120% 90% at 85% 10%, #FFF8EA 0%, var(--cream) 45%, var(--cream2) 100%);color:var(--navy)}
  .t-navy{background:radial-gradient(110% 90% at 80% 0%, var(--navy2) 0%, var(--navy) 60%, #0C1528 100%);color:var(--cream)}
  .t-navy .kicker{color:var(--gold)}
  .t-red{background:radial-gradient(110% 100% at 85% 0%, #E2363D 0%, var(--red) 45%, var(--red-deep) 100%);color:#fff}
  .t-red .kicker{color:#fff}
  .t-red .kicker::before{background:var(--gold)}

  /* decorative rings, right side */
  .rings{position:absolute;right:calc(var(--u)*-9);top:calc(var(--u)*-6);width:calc(var(--u)*48);height:calc(var(--u)*48);border-radius:50%;border:calc(var(--u)*.5) solid var(--gold);opacity:.55}
  .rings::before{content:"";position:absolute;inset:calc(var(--u)*5);border-radius:50%;border:calc(var(--u)*2.2) solid var(--red);opacity:.16}
  .rings::after{content:"";position:absolute;inset:calc(var(--u)*13);border-radius:50%;background:var(--gold);opacity:.18}
  .t-red .rings::before{border-color:#fff;opacity:.12}
  .t-navy .rings::before{border-color:var(--red);opacity:.45}

  /* text slide with a photo behind it */
  .has-bg{color:#fff}
  .has-bg .kicker{color:var(--gold)}
  .bgimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .bgshade{position:absolute;inset:0;background:linear-gradient(90deg, rgba(12,21,40,.92) 0%, rgba(12,21,40,.72) 45%, rgba(12,21,40,.15) 100%)}

  /* event slide */
  .s-event{background:radial-gradient(120% 90% at 85% 10%, #FFF8EA 0%, var(--cream) 45%, var(--cream2) 100%);color:var(--navy)}
  .ev{display:flex;align-items:center;gap:calc(var(--u)*5)}
  .datetile{flex:none;width:calc(var(--u)*21);border-radius:calc(var(--u)*1.6);overflow:hidden;box-shadow:0 calc(var(--u)*1.2) calc(var(--u)*3) rgba(19,32,59,.22);transform:rotate(-2.5deg)}
  .datetile .m{background:var(--navy);color:var(--gold);font:800 calc(var(--u)*2.1)/1 var(--sans);letter-spacing:.2em;text-transform:uppercase;text-align:center;padding:calc(var(--u)*1.5) 0}
  .datetile .d{background:var(--red);color:#fff;font:700 calc(var(--u)*11)/1 var(--serif);text-align:center;padding:calc(var(--u)*1.6) 0 calc(var(--u)*2.2)}
  .datetile .d.word{font-size:calc(var(--u)*7.2);padding:calc(var(--u)*3.2) 0 calc(var(--u)*3.6);letter-spacing:.02em}
  .meta{display:flex;gap:calc(var(--u)*3.2);margin-top:calc(var(--u)*2.2);font:600 calc(var(--u)*2.1)/1.2 var(--sans)}
  .meta span{display:inline-flex;align-items:center;gap:calc(var(--u)*.9)}
  .meta svg{width:calc(var(--u)*2.3);height:calc(var(--u)*2.3);color:var(--red);flex:none}
  .s-event .title{font-size:calc(var(--u)*5.8)}

  /* notice slides (holiday schedules) */
  .n-cream{background:radial-gradient(120% 90% at 85% 10%, #FFF8EA 0%, var(--cream) 45%, var(--cream2) 100%);color:var(--navy)}
  .n-navy{background:radial-gradient(110% 90% at 80% 0%, var(--navy2) 0%, var(--navy) 60%, #0C1528 100%);color:var(--cream)}
  .n-navy .kicker{color:var(--gold)}
  .n-navy .datetile .m{background:var(--gold);color:var(--navy)}
  .n-navy .datetile{box-shadow:0 calc(var(--u)*1.2) calc(var(--u)*3) rgba(0,0,0,.45)}
  .n-navy .rings::before{border-color:var(--red);opacity:.45}
  .s-notice .title{font-size:calc(var(--u)*5.2);max-width:calc(var(--u)*62)}
  .s-notice .nb{min-width:0}
  .datetile .thru{background:#fff;color:var(--navy);font:800 calc(var(--u)*1.7)/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;text-align:center;padding:calc(var(--u)*1.2) 0}
  .rows{list-style:none;margin-top:calc(var(--u)*2.4);display:grid;gap:calc(var(--u)*1);max-width:calc(var(--u)*62)}
  .rows li{display:flex;align-items:center;gap:calc(var(--u)*1.6);padding:calc(var(--u)*1.05) calc(var(--u)*1.4);border-radius:calc(var(--u)*1);background:rgba(19,32,59,.06);border:1px solid rgba(19,32,59,.08)}
  .n-navy .rows li{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.1)}
  .rows .when{flex:1;font:700 calc(var(--u)*2.15)/1.15 var(--sans)}
  .rows .note{font:500 calc(var(--u)*1.5)/1.2 var(--sans);opacity:.75}
  .pill{flex:none;font:800 calc(var(--u)*1.35)/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;padding:calc(var(--u)*.8) calc(var(--u)*1.3);border-radius:99px;white-space:nowrap}
  .p-closed{background:var(--red);color:#fff}
  .p-early{background:var(--gold);color:var(--navy)}
  .p-open{background:#1F7A4D;color:#fff}
  .p-event{background:var(--navy);color:var(--gold)}
  .n-navy .p-event{background:var(--cream);color:var(--navy)}

  /* scripture */
  .s-scripture{background:radial-gradient(110% 90% at 20% 0%, var(--navy2) 0%, var(--navy) 55%, #0C1528 100%);color:var(--cream)}
  .s-scripture .pad{align-items:center;text-align:center}
  .quote-mark{font:700 calc(var(--u)*14)/.6 var(--serif);color:var(--gold);height:calc(var(--u)*6)}
  .verse{font:italic 500 calc(var(--u)*4.1)/1.3 var(--serif);max-width:calc(var(--u)*72);text-wrap:balance}
  .votw-k{display:flex;align-items:center;gap:calc(var(--u)*1.4);margin-bottom:calc(var(--u)*2.6)}
  .votw-k span{background:var(--gold);color:var(--navy);font:800 calc(var(--u)*1.35)/1 var(--sans);letter-spacing:.22em;text-transform:uppercase;padding:calc(var(--u)*.9) calc(var(--u)*1.6);border-radius:99px}
  .votw-k i{font:italic 500 calc(var(--u)*1.9)/1 var(--serif);color:var(--cream);opacity:.85}
  .s-votw{background:radial-gradient(110% 90% at 80% 100%, #3A1420 0%, var(--navy) 55%, #0C1528 100%)}
  .s-votw .verse{max-width:calc(var(--u)*78)}
  .s-votw .quote-mark{font-size:calc(var(--u)*10);height:calc(var(--u)*4.4)}
  .cite{margin-top:calc(var(--u)*2.6);font:800 calc(var(--u)*1.5)/1 var(--sans);letter-spacing:.24em;text-transform:uppercase;color:var(--gold)}

  /* image + video slides */
  .s-media{background:#000}
  .s-media img.main,.s-media video.main{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .s-media.contain img.main,.s-media.contain video.main{object-fit:contain;height:calc(100% - var(--l3h));}
  .s-media .blur{position:absolute;inset:-6%;width:112%;height:112%;object-fit:cover;filter:blur(40px) brightness(.55) saturate(1.2)}
  .kb{animation:kb var(--kbdur,14s) ease-out forwards;transform-origin:var(--kbo,60% 40%)}
  @keyframes kb{from{transform:scale(1.0)}to{transform:scale(1.12)}}
  .s-media iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  .caption{position:absolute;left:calc(var(--u)*4);top:calc(var(--u)*4);max-width:calc(var(--u)*60);background:rgba(19,32,59,.9);color:var(--cream);border-left:calc(var(--u)*.6) solid var(--gold);padding:calc(var(--u)*1.6) calc(var(--u)*2.2);border-radius:0 calc(var(--u)*.8) calc(var(--u)*.8) 0;backdrop-filter:blur(6px)}
  .caption b{display:block;font:700 calc(var(--u)*3)/1.1 var(--serif)}
  .caption small{display:block;font:500 calc(var(--u)*1.6)/1.3 var(--sans);opacity:.85;margin-top:calc(var(--u)*.6)}

  /* ============ LOWER THIRD ============ */
  #l3{position:fixed;left:0;right:0;bottom:0;height:var(--l3h);z-index:10;display:flex;flex-direction:column;filter:drop-shadow(0 calc(var(--u)*-.6) calc(var(--u)*2) rgba(0,0,0,.28))}
  .ticker{flex:none;height:calc(var(--u)*2.9);display:flex;background:var(--red);color:#fff;overflow:hidden}
  .ticker .tag{flex:none;display:flex;align-items:center;padding:0 calc(var(--u)*1.8);background:var(--gold);color:var(--navy);font:800 calc(var(--u)*1.15)/1 var(--sans);letter-spacing:.18em;text-transform:uppercase;clip-path:polygon(0 0,100% 0,calc(100% - var(--u)*1.2) 100%,0 100%);padding-right:calc(var(--u)*2.8)}
  .ticker .tag{gap:calc(var(--u)*1.1);letter-spacing:0;text-transform:none;max-width:48%;transition:background .5s}
  .tag .lab{font:800 calc(var(--u)*1.05)/1 var(--sans);letter-spacing:.18em;text-transform:uppercase;white-space:nowrap}
  .tag .dot{width:calc(var(--u)*1);height:calc(var(--u)*1);border-radius:50%;background:var(--red);flex:none;box-shadow:0 0 0 0 rgba(211,36,44,.6);animation:pulse 1.8s ease-out infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(211,36,44,.55)}100%{box-shadow:0 0 0 calc(var(--u)*1.1) rgba(211,36,44,0)}}
  .tag .what{display:flex;align-items:baseline;gap:calc(var(--u)*.9);min-width:0;padding-left:calc(var(--u)*1.1);border-left:2px solid rgba(19,32,59,.35);transition:opacity .45s}
  .tag .what b{font:700 calc(var(--u)*1.6)/1 var(--serif);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tag .what i{font:600 calc(var(--u)*1.1)/1 var(--sans);font-style:normal;white-space:nowrap;opacity:.8}
  .tag .what.fade{opacity:0}
  .ticker .tag.next{background:#F7F0E3}
  .ticker .tag.next .dot{display:none}
  .ticker .tag.quiet .what{display:none}
  .marquee{flex:1;overflow:hidden;display:flex;align-items:center;mask-image:linear-gradient(90deg,transparent 0,#000 3%,#000 97%,transparent 100%)}
  .track{display:flex;white-space:nowrap;animation:scroll var(--tdur,40s) linear infinite;will-change:transform}
  .track span{font:600 calc(var(--u)*1.45)/1 var(--sans);padding:0 calc(var(--u)*1.6);display:inline-flex;align-items:center;gap:calc(var(--u)*3.2)}
  .track span::after{content:"";width:calc(var(--u)*.6);height:calc(var(--u)*.6);background:var(--gold);transform:rotate(45deg);margin-left:calc(var(--u)*1.6)}
  @keyframes scroll{to{transform:translateX(-50%)}}

  .progress{flex:none;height:calc(var(--u)*.3);background:rgba(255,255,255,.12)}
  .progress i{display:block;height:100%;width:0;background:var(--gold)}

  .bar{flex:1;background:linear-gradient(180deg,var(--navy2) 0%,var(--navy) 100%);display:flex;align-items:center;justify-content:space-between;padding:0 calc(var(--u)*2.2) 0 calc(var(--u)*3)}
  .ident{display:flex;align-items:center;gap:calc(var(--u)*1.6);min-width:0}
  .badge{flex:none;width:calc(var(--u)*7);height:calc(var(--u)*7);border-radius:calc(var(--u)*1.2);background:var(--red);display:grid;place-items:center;color:#fff;font:700 calc(var(--u)*3)/1 var(--serif);box-shadow:inset 0 0 0 calc(var(--u)*.3) var(--gold)}
  .badge img{width:100%;height:100%;object-fit:contain;border-radius:inherit;background:#fff;padding:calc(var(--u)*.5)}
  .badge.has-logo{background:none;box-shadow:none;border-radius:0;width:calc(var(--u)*7.3);height:calc(var(--u)*8.7)}
  .badge.has-logo img{background:none;padding:0;border-radius:0;filter:drop-shadow(0 calc(var(--u)*.3) calc(var(--u)*.6) rgba(0,0,0,.35))}
  .names{min-width:0}
  .names b{display:block;color:#fff;font:700 calc(var(--u)*2.35)/1.05 var(--serif);white-space:nowrap}
  .names small{display:block;color:var(--gold);font:600 calc(var(--u)*1.1)/1.3 var(--sans);letter-spacing:.03em;margin-top:calc(var(--u)*.6)}
  .clock{flex:none;display:flex;align-items:center;gap:calc(var(--u)*1);background:var(--navy);color:#fff;padding:0 calc(var(--u)*2.2) 0 calc(var(--u)*2.6);clip-path:polygon(calc(var(--u)*1.2) 0,100% 0,100% 100%,0 100%)}
  .clock b{font:800 calc(var(--u)*1.5)/1 var(--sans);font-variant-numeric:tabular-nums}
  .clock b em{font-style:normal;font-size:.7em;margin-left:.25em;color:var(--gold)}
  .clock small{font:500 calc(var(--u)*1.15)/1 var(--sans);opacity:.85;padding-left:calc(var(--u)*1);border-left:1px solid rgba(255,255,255,.3)}

  .qrs{display:flex;gap:calc(var(--u)*1.2);flex:none}
  .qr{display:flex;align-items:center;gap:calc(var(--u)*1.1);background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:calc(var(--u)*1.2);padding:calc(var(--u)*.6) calc(var(--u)*1.3) calc(var(--u)*.6) calc(var(--u)*.6)}
  .qr .code{width:calc(var(--u)*8.6);height:calc(var(--u)*8.6);background:#fff;border-radius:calc(var(--u)*.7);padding:calc(var(--u)*.55);flex:none}
  .qr .code svg{width:100%;height:100%;display:block}
  .qr .lbl{color:#fff;width:calc(var(--u)*8.4)}
  .qr .lbl small{display:block;font:800 calc(var(--u)*.95)/1 var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin-bottom:calc(var(--u)*.6)}
  .qr .lbl b{display:block;font:700 calc(var(--u)*1.6)/1.1 var(--serif)}
  .qr .lbl i{display:block;font:400 calc(var(--u)*1.1)/1.3 var(--sans);font-style:normal;opacity:.75;margin-top:calc(var(--u)*.5)}
  .qr.expired .code{padding:calc(var(--u)*1.6)}
  .qr.expired small{visibility:hidden}
  .qr.hot{background:var(--red);border-color:var(--red)}
  .qr.hot .lbl small{color:#fff;opacity:.85}

  /* full screen hint */
  #hint{position:fixed;top:calc(var(--u)*1.5);right:calc(var(--u)*1.5);z-index:20;background:rgba(19,32,59,.85);color:#fff;font:500 calc(var(--u)*1.1)/1 var(--sans);padding:calc(var(--u)*.8) calc(var(--u)*1.2);border-radius:99px;transition:opacity .6s}
  #hint.gone{opacity:0;pointer-events:none}
  #paused{position:fixed;top:calc(var(--u)*1.5);left:calc(var(--u)*1.5);z-index:20;background:var(--gold);color:var(--navy);font:800 calc(var(--u)*1)/1 var(--sans);letter-spacing:.2em;padding:calc(var(--u)*.8) calc(var(--u)*1.2);border-radius:99px;display:none}
  body.is-paused #paused{display:block}
</style>
</head>
<body>
<div id="stage"></div>

<div id="l3">
  <div class="ticker">
    <div class="tag quiet" id="tag"><span class="dot"></span><span class="lab" id="tagLab">Happening Now</span><span class="what" id="tagWhat"><b id="tagName"></b><i id="tagTime"></i></span></div>
    <div class="marquee"><div class="track" id="track"></div></div>
    <div class="clock"><b id="time"></b><small id="date"></small></div>
  </div>
  <div class="progress"><i id="prog"></i></div>
  <div class="bar">
    <div class="ident">
      <div class="badge" id="badge">HT</div>
      <div class="names"><b id="corps"></b><small id="org"></small></div>
    </div>
    <div class="qrs">
      <div class="qr hot"><div class="code" id="qr1"></div><div class="lbl"><small>Scan to</small><b id="l1"></b><i id="h1"></i></div></div>
      <div class="qr"><div class="code" id="qr2"></div><div class="lbl"><small>Scan to</small><b id="l2"></b><i id="h2"></i></div></div>
      <div class="qr"><div class="code" id="qr3"></div><div class="lbl"><small>Scan to</small><b id="l3t"></b><i id="h3"></i></div></div>
    </div>
  </div>
</div>

<div id="hint">Click anywhere or press F for full screen</div>
<div id="paused">PAUSED</div>

<script src="qrcode.js"></script>
<script src="config.js"></script>
<script>
(function(){
  const C = window.LOBBY || {};
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const store = {
    get(k){ try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } },
    set(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
  };

  /* ---------- Lower third ---------- */
  $("corps").textContent = C.corpsName || "";
  $("org").textContent = C.orgLine || "";
  if (C.logo) {
    const im = new Image();
    im.onload = () => { $("badge").textContent = ""; $("badge").classList.add("has-logo"); $("badge").appendChild(im); };
    im.alt = ""; im.src = C.logo;
  }

  function qrSvg(text){
    try {
      qrcode.stringToBytes = qrcode.stringToBytesFuncs["UTF-8"];
      const q = qrcode(0, text && text.length > 200 ? "L" : "M"); q.addData(text || " "); q.make();
      return q.createSvgTag({ cellSize: 4, margin: 0, scalable: true });
    } catch(e){ console.warn("QR failed", e); return ""; }
  }
  const vEsc = s => String(s || "").replace(/([,;\\])/g, "\\$1");
  function vcard(c){
    const L = ["BEGIN:VCARD","VERSION:3.0",
      "FN:" + vEsc(c.name), "ORG:" + vEsc(c.org)];
    if (c.street || c.city) L.push("ADR;TYPE=WORK:;;" + [c.street, c.city, c.state, c.zip, "USA"].map(vEsc).join(";"));
    if (c.phone) L.push("TEL;TYPE=WORK,VOICE:" + c.phone);
    if (c.email) L.push("EMAIL;TYPE=WORK:" + c.email);
    if (c.website) L.push("URL:" + c.website);
    L.push("END:VCARD");
    return L.join("\r\n");
  }
  const s1 = C.volunteerSignup || {}, s2 = C.volunteerCheckin || {}, s3 = C.contactCard || {};
  $("qr1").innerHTML = qrSvg(s1.url); $("l1").textContent = s1.label || ""; $("h1").textContent = s1.hint || "";
  /* Golden check-in links carry an expiry date inside them. Read it so we never show a dead code. */
  function linkExpiry(url){
    try {
      const m = String(url).match(/\/(ey[\w-]+)\.(ey[\w-]+)\.[\w-]+/); if (!m) return null;
      const p = JSON.parse(atob(m[2].replace(/-/g, "+").replace(/_/g, "/")));
      return p.exp ? p.exp * 1000 : null;
    } catch(e){ return null; }
  }
  let checkinUrl = s2.url;
  function renderCheckin(){
    const exp = linkExpiry(checkinUrl);
    const box = $("qr2").parentElement;
    if (exp && Date.now() > exp) {
      box.classList.add("expired");
      $("qr2").innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="#13203B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18M5 21V10l7-5 7 5v11"/><path d="M10 21v-6h4v6"/></svg>';
      $("h2").textContent = s2.expiredHint || "See the front desk";
    } else {
      box.classList.remove("expired");
      $("qr2").innerHTML = qrSvg(checkinUrl);
      $("h2").textContent = s2.hint || "";
    }
  }
  $("l2").textContent = s2.label || "";
  renderCheckin(); setInterval(renderCheckin, 60e3);
  $("qr3").innerHTML = qrSvg(vcard(s3)); $("l3t").textContent = s3.label || ""; $("h3").textContent = s3.hint || "";

  /* ticker */
  let tickerItems = C.ticker || [];
  function renderTicker(){
    const t = $("track");
    const items = tickerItems.length ? tickerItems : [C.corpsName || "Welcome"];
    const html = items.map(x => "<span>" + esc(x) + "</span>").join("");
    t.innerHTML = html + html;   // doubled for a seamless loop
    requestAnimationFrame(() => {
      const w = t.scrollWidth / 2;
      const pxPerSec = window.innerWidth * 0.055;
      t.style.setProperty("--tdur", Math.max(20, w / pxPerSec) + "s");
    });
  }
  renderTicker();
  if (document.fonts) document.fonts.ready.then(renderTicker);

  /* ---------- Weekly schedule: what's happening now / up next ---------- */
  const DAYS = ["sun","mon","tue","wed","thu","fri","sat"];
  const DAYNAMES = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  function parseDays(d){
    const s = String(d || "").toLowerCase();
    if (/every\s*day|daily/.test(s)) return [0,1,2,3,4,5,6];
    if (/weekdays?/.test(s)) return [1,2,3,4,5];
    const out = [];
    s.split(/[^a-z]+/).forEach(w => { const i = DAYS.indexOf(w.slice(0,3)); if (i >= 0 && w.length >= 3) out.push(i); });
    return out;
  }
  function parseTime(t){
    const m = String(t || "").trim().toLowerCase().match(/^(\d{1,2})(?::(\d{2}))?\s*(am|pm|a|p)?$/);
    if (!m) return null;
    let h = +m[1]; const mi = +(m[2] || 0); const ap = m[3];
    if (ap && ap[0] === "p" && h < 12) h += 12;
    if (ap && ap[0] === "a" && h === 12) h = 0;
    return h * 60 + mi;
  }
  function fmt(mins){
    const h = Math.floor(mins / 60) % 24, m = mins % 60;
    return ((h % 12) || 12) + (m ? ":" + String(m).padStart(2, "0") : "") + (h < 12 ? " AM" : " PM");
  }
  let schedule = [], exceptions = [];
  function setSchedule(list){
    schedule = (list || []).map(x => {
      const s = parseTime(x.start || x.from); let e = parseTime(x.end || x.to);
      if (s != null && e == null) e = s + (parseFloat(x.minutes) || 60);   // no end time given: assume 1 hour
      return { name: x.name || x.title, place: x.place || "", calendar: (x.calendar || "corps").toLowerCase(),
               days: parseDays(x.days || x.weekly), s, e, noEnd: !(x.end || x.to) };
    }).filter(x => x.name && x.days.length && x.s != null && x.e > x.s);
  }
  setSchedule(C.schedule);

  /* Exceptions: closed days, early closings, special hours. Each applies to one calendar ("corps", "gains", ...). */
  const ymd = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  function setExceptions(list){
    exceptions = (list || []).map(x => ({
      from: String(x.date).trim(), to: String(x.until || x.date).trim(), cal: (x.calendar || "corps").toLowerCase(),
      closed: !!x.closed, closesAt: parseTime(x.closesAt), s: parseTime(x.start), e: parseTime(x.end), label: x.label || ""
    })).filter(x => x.from);
  }
  setExceptions(C.exceptions);
  const exFor = (key, cal) => exceptions.filter(x => x.cal === cal && key >= x.from && key <= x.to);

  /* The real program list for one calendar day, after closures and special hours. */
  function itemsOn(date){
    const key = ymd(date), wd = date.getDay(), out = [];
    schedule.forEach(x => {
      if (!x.days.includes(wd)) return;
      let s = x.s, e = x.e, cut = false;
      for (const ex of exFor(key, x.calendar)) {
        if (ex.closed) return;
        if (ex.s != null && ex.e != null) { s = ex.s; e = ex.e; }
        if (ex.closesAt != null) { if (s >= ex.closesAt) return; if (e > ex.closesAt) { e = ex.closesAt; cut = true; } }
      }
      out.push(Object.assign({}, x, { s, e, cut }));
    });
    return out;
  }
  function closedToday(){
    const k = ymd(new Date());
    return exceptions.find(x => x.cal === "corps" && k >= x.from && k <= x.to && (x.closed || x.closesAt != null)) || null;
  }
  function nowList(){
    const d = new Date(), m = d.getHours() * 60 + d.getMinutes();
    return itemsOn(d).filter(x => m >= x.s && m < x.e).sort((a, b) => a.e - b.e);
  }
  function nextUp(){
    const now = new Date(), m = now.getHours() * 60 + now.getMinutes();
    for (let k = 0; k < 14; k++) {
      const d = new Date(now.getFullYear(), now.getMonth(), now.getDate() + k);
      const c = itemsOn(d).filter(x => k > 0 || x.s > m).sort((a, b) => a.s - b.s)[0];
      if (c) return { item: c, when: k === 0 ? "Today " + fmt(c.s) : k === 1 ? "Tomorrow " + fmt(c.s) : k < 7 ? DAYNAMES[d.getDay()] + " " + fmt(c.s) : d.toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" }) + ", " + fmt(c.s) };
    }
    return null;
  }
  let liveIdx = 0, lastKey = "";
  function renderNow(){
    const tag = $("tag"), what = $("tagWhat");
    const live = nowList();
    let lab, name = "", time = "", mode;
    if (live.length) {
      const x = live[liveIdx++ % live.length];
      mode = "live"; lab = "Happening Now"; name = x.name;
      time = (x.place ? x.place + " · " : "") + (x.noEnd && !x.cut ? "started " + fmt(x.s) : "until " + fmt(x.e));
    } else {
      const n = nextUp(), cl = closedToday();
      // On a Corps holiday, alternate between the closure notice and what's next
      if (cl && (!n || liveIdx++ % 2 === 0)) {
        const nowM = new Date().getHours() * 60 + new Date().getMinutes();
        const past = !cl.closed && nowM >= cl.closesAt;
        mode = "next"; name = cl.label || "Harlem Temple";
        lab = cl.closed ? "Closed Today" : past ? "Closed" : "Closing Early";
        time = cl.closed ? "" : (past ? "Closed at " : "Closes at ") + fmt(cl.closesAt);
      }
      else if (n) { mode = "next"; lab = "Up Next"; name = n.item.name; time = n.when; }
      else { mode = "quiet"; lab = "Happening Now"; }
    }
    const key = mode + name + time;
    if (key === lastKey) return;
    const apply = () => {
      tag.classList.toggle("next", mode === "next"); tag.classList.toggle("quiet", mode === "quiet");
      $("tagLab").textContent = lab; $("tagName").textContent = name; $("tagTime").textContent = time;
      what.classList.remove("fade"); lastKey = key;
    };
    if (lastKey) { what.classList.add("fade"); setTimeout(apply, 450); } else apply();
  }
  renderNow(); setInterval(renderNow, 7000);

  /* clock */
  function tick(){
    const d = new Date();
    const t = d.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" }).split(" ");
    $("time").innerHTML = esc(t[0]) + "<em>" + esc(t[1] || "") + "</em>";
    $("date").textContent = d.toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric" });
  }
  tick(); setInterval(tick, 1000 * 15);

  /* ---------- Verse of the Week: picks this week's verse, changing every Monday ---------- */
  function mondayOf(d){ const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; }
  function verseOfTheWeek(){
    const cfg = C.verseOfWeek || {}, all = cfg.verses || [];
    if (!all.length) return null;
    const mon = mondayOf(new Date()), key = ymd(mon);
    const pinned = all.find(v => v.week === key);
    if (pinned) return Object.assign({ monday: mon }, pinned);
    const pool = all.filter(v => !v.week); if (!pool.length) return null;
    const start = mondayOf(day(cfg.startWeek) || new Date(2026, 8, 28));
    const weeks = Math.round((mon - start) / (7 * 864e5));
    return Object.assign({ monday: mon }, pool[((weeks % pool.length) + pool.length) % pool.length]);
  }

  /* ---------- Slides ---------- */
  let slides = (C.slides || []).slice();
  const cached = store.get("lobby-sheet");
  if (C.sheetCsvUrl && cached && cached.slides && cached.slides.length) { slides = cached.slides; if (cached.ticker && cached.ticker.length) { tickerItems = cached.ticker; renderTicker(); } }

  const day = x => { if (!x) return null; const t = new Date(String(x).trim() + "T00:00:00"); return isNaN(t) ? null : t; };
  /* lead: show the slide this many business days (Mon to Fri) before its date */
  function businessDaysBefore(d, n){
    const x = new Date(d);
    while (n > 0) { x.setDate(x.getDate() - 1); if (x.getDay() !== 0 && x.getDay() !== 6) n--; }
    return x;
  }
  function isLive(s){
    const now = new Date();
    let st = day(s.start);
    if (!st && s.lead && day(s.date)) st = businessDaysBefore(day(s.date), parseInt(s.lead, 10));
    if (st && now < st) return false;
    let en = day(s.end || s.until || (s.type === "event" || s.type === "notice" ? s.date : null));
    if (en) { en.setDate(en.getDate() + 1); if (now >= en) return false; }
    return true;
  }
  const live = () => slides.filter(s => s && s.type && s.type !== "ticker" && isLive(s));

  const ICON_CLOCK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9.5"/><path d="M12 7v5l3.2 2"/></svg>';
  const ICON_PIN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>';

  function el(cls, html){ const d = document.createElement("div"); d.className = cls; if (html) d.innerHTML = html; return d; }
  function loadImg(src){
    return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error("Image not found: " + src)); i.src = src; });
  }
  function textBlock(s){
    return (s.kicker ? '<div class="kicker">' + esc(s.kicker) + '</div>' : '') +
           (s.title ? '<h1 class="title">' + esc(s.title) + '</h1>' : '') +
           (s.subtitle ? '<p class="body" style="font-weight:600">' + esc(s.subtitle) + '</p>' : '') +
           (s.body ? '<p class="body">' + esc(s.body) + '</p>' : '');
  }
  function durationOf(s){ return (parseFloat(s.duration) || C.defaultDuration || 12) * 1000; }

  async function build(s){
    const type = String(s.type).toLowerCase().trim();

    if (type === "text") {
      const d = el("slide t-" + (s.theme || "cream"));
      if (s.media) {
        const img = await loadImg(s.media);
        img.className = "bgimg kb"; img.style.setProperty("--kbdur", (durationOf(s) / 1000 + 4) + "s");
        d.classList.add("has-bg"); d.appendChild(img); d.appendChild(el("bgshade"));
      } else d.appendChild(el("rings"));
      d.appendChild(el("pad", textBlock(s)));
      return d;
    }

    if (type === "event") {
      const d = el("slide s-event");
      d.appendChild(el("rings"));
      let tile;
      if (s.weekly) {
        tile = '<div class="m">Every</div><div class="d word">' + esc(String(s.weekly).slice(0,3)) + '</div>';
      } else {
        const dt = day(s.date) || new Date();
        tile = '<div class="m">' + (dt.toLocaleDateString("en-US", { weekday: "short" }) + " · " + dt.toLocaleDateString("en-US", { month: "short" })) + '</div><div class="d">' + dt.getDate() + '</div>';
      }
      const meta = (s.time ? '<span>' + ICON_CLOCK + esc(s.time) + '</span>' : '') + (s.place ? '<span>' + ICON_PIN + esc(s.place) + '</span>' : '');
      d.appendChild(el("pad", '<div class="ev"><div class="datetile">' + tile + '</div><div>' +
        '<div class="kicker">' + esc(s.kicker || (s.weekly ? "Weekly" : "Upcoming")) + '</div>' +
        '<h1 class="title">' + esc(s.title) + '</h1>' +
        (meta ? '<div class="meta">' + meta + '</div>' : '') +
        (s.body ? '<p class="body">' + esc(s.body) + '</p>' : '') + '</div></div>'));
      return d;
    }

    if (type === "notice") {
      const d = el("slide s-notice " + (s.theme === "navy" ? "n-navy" : "n-cream"));
      d.appendChild(el("rings"));
      const dt = day(s.date) || new Date(), last = day(s.until);
      const short = x => x.toLocaleDateString("en-US", { month: "short", day: "numeric" });
      const tile = '<div class="m">' + (dt.toLocaleDateString("en-US", { weekday: "short" }) + " · " + dt.toLocaleDateString("en-US", { month: "short" })) + '</div><div class="d">' + dt.getDate() + '</div>' +
        (last && last > dt ? '<div class="thru">thru ' + esc(short(last)) + '</div>' : '');
      const fd = x => x.toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" });
      const rows = (s.rows || []).map(r => {
        const a = day(r.date), b = day(r.until);
        const when = a ? (b && b > a ? fd(a) + " to " + fd(b) : fd(a)) : esc(r.when || "");
        return '<li><span class="when">' + esc(when) + '</span><span class="pill p-' + esc(r.tone || "closed") + '">' + esc(r.status) + '</span>' +
               (r.note ? '<span class="note">' + esc(r.note) + '</span>' : '') + '</li>';
      }).join("");
      d.appendChild(el("pad", '<div class="ev"><div class="datetile">' + tile + '</div><div class="nb">' +
        '<div class="kicker">' + esc(s.kicker || "Notice") + '</div>' +
        '<h1 class="title">' + esc(s.title) + '</h1>' +
        (rows ? '<ul class="rows">' + rows + '</ul>' : '') +
        (s.body ? '<p class="body">' + esc(s.body) + '</p>' : '') + '</div></div>'));
      return d;
    }

    if (type === "verseofweek") {
      const v = verseOfTheWeek();
      if (!v) throw new Error("No verse of the week set");
      const d = el("slide s-scripture s-votw");
      const wk = v.monday.toLocaleDateString("en-US", { month: "long", day: "numeric" });
      let txt = String(v.text).trim();
      if (/^[“"]/.test(txt) && /[”"]$/.test(txt)) txt = txt.slice(1, -1);   // the big quote mark already frames it
      const size = txt.length > 170 ? 2.85 : txt.length > 120 ? 3.3 : 3.9;
      d.appendChild(el("pad", '<div class="votw-k"><span>Verse of the Week</span><i>Week of ' + esc(wk) + '</i></div>' +
        '<div class="quote-mark">&ldquo;</div><p class="verse" style="font-size:calc(var(--u)*' + size + ')">' + esc(txt) + '</p>' +
        '<div class="cite">' + esc(v.ref) + ' (NIV)</div>'));
      return d;
    }

    if (type === "scripture" || type === "quote") {
      const d = el("slide s-scripture");
      d.appendChild(el("pad", '<div class="quote-mark">&ldquo;</div><p class="verse">' + esc(s.text || s.body || s.title) + '</p>' + (s.cite ? '<div class="cite">' + esc(s.cite) + '</div>' : '')));
      return d;
    }

    if (type === "image") {
      const img = await loadImg(s.media);
      const contain = s.fit === "contain";
      const d = el("slide s-media" + (contain ? " contain" : ""));
      if (contain) { const b = img.cloneNode(); b.className = "blur"; d.appendChild(b); }
      img.className = "main" + (contain ? "" : " kb");
      img.style.setProperty("--kbdur", (durationOf(s) / 1000 + 4) + "s");
      img.style.setProperty("--kbo", ["30% 30%","70% 35%","50% 60%","40% 50%"][Math.floor(Math.random()*4)]);
      d.appendChild(img);
      if (s.title || s.subtitle) d.appendChild(el("caption", (s.title ? "<b>" + esc(s.title) + "</b>" : "") + (s.subtitle ? "<small>" + esc(s.subtitle) + "</small>" : "")));
      return d;
    }

    if (type === "video") {
      const v = document.createElement("video");
      v.muted = true; v.playsInline = true; v.preload = "auto"; v.className = "main";
      v.setAttribute("muted", ""); v.setAttribute("playsinline", "");
      await new Promise((res, rej) => { v.onloadeddata = res; v.onerror = () => rej(new Error("Video not found: " + s.media)); v.src = s.media; });
      const d = el("slide s-media" + (s.fit === "contain" ? " contain" : ""));
      d.appendChild(v);
      if (s.title || s.subtitle) d.appendChild(el("caption", (s.title ? "<b>" + esc(s.title) + "</b>" : "") + (s.subtitle ? "<small>" + esc(s.subtitle) + "</small>" : "")));
      return d;
    }

    if (type === "youtube") {
      const m = String(s.media || "").match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([\w-]{11})/) || String(s.media).match(/^([\w-]{11})$/);
      if (!m) throw new Error("Bad YouTube link: " + s.media);
      const d = el("slide s-media");
      d.innerHTML = '<iframe allow="autoplay; encrypted-media" src="https://www.youtube-nocookie.com/embed/' + m[1] + '?autoplay=1&mute=1&controls=0&rel=0&playsinline=1&modestbranding=1&loop=1&playlist=' + m[1] + '"></iframe>';
      if (!s.duration) s.duration = 45;
      return d;
    }

    throw new Error("Unknown slide type: " + s.type);
  }

  const stage = $("stage"), prog = $("prog");
  let idx = -1, timer = null, current = null, paused = false, busy = false;
  const bootTime = Date.now();

  function progress(ms, video){
    prog.style.transition = "none"; prog.style.width = "0";
    if (video && !ms) { video.ontimeupdate = () => { if (video.duration) prog.style.width = (100 * video.currentTime / video.duration) + "%"; }; return; }
    void prog.offsetWidth;
    prog.style.transition = "width " + ms + "ms linear"; prog.style.width = "100%";
  }

  function show(d, s){
    stage.appendChild(d);
    requestAnimationFrame(() => requestAnimationFrame(() => d.classList.add("on")));
    const old = current; current = d;
    if (old) {
      old.classList.remove("on"); old.classList.add("off");
      setTimeout(() => { old.querySelectorAll("video").forEach(v => { v.pause(); v.removeAttribute("src"); v.load(); }); old.remove(); }, 1300);
    }
    const v = d.querySelector("video");
    if (v) {
      v.currentTime = 0; v.play().catch(() => {});
      v.onended = () => next();
      const ms = s.duration ? durationOf(s) : 0;
      progress(ms, v);
      timer = setTimeout(next, ms || 15 * 60 * 1000);
    } else {
      const ms = durationOf(s); progress(ms); timer = setTimeout(next, ms);
    }
  }

  async function next(step){
    step = step || 1;
    clearTimeout(timer);
    if (paused || busy) return;
    if (C.reloadEveryHours && Date.now() - bootTime > C.reloadEveryHours * 3600e3 && navigator.onLine !== false) { location.reload(); return; }
    busy = true;
    const list = live();
    if (!list.length) list.push({ type: "text", theme: "navy", kicker: "Welcome", title: C.corpsName || "Welcome" });
    for (let tries = 0; tries < list.length; tries++) {
      idx = ((idx + step) % list.length + list.length) % list.length;
      const s = list[idx];
      try {
        const d = await Promise.race([build(s), new Promise((_, r) => setTimeout(() => r(new Error("Timed out")), 20000))]);
        busy = false; show(d, s); return;
      } catch(e) { console.warn("Skipping slide:", e.message, s); }
    }
    busy = false;
    timer = setTimeout(next, 10000);
  }

  /* ---------- Google Sheet (optional) ---------- */
  function parseCSV(text){
    const rows = []; let row = [], f = "", q = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (q) { if (c === '"') { if (text[i+1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
      else if (c === '"') q = true;
      else if (c === ",") { row.push(f); f = ""; }
      else if (c === "\n") { row.push(f); rows.push(row); row = []; f = ""; }
      else if (c !== "\r") f += c;
    }
    if (f || row.length) { row.push(f); rows.push(row); }
    const head = (rows.shift() || []).map(h => h.trim().toLowerCase());
    return rows.filter(r => r.some(x => x.trim())).map(r => { const o = {}; head.forEach((h, i) => { if (h && r[i] != null && r[i].trim() !== "") o[h] = r[i].trim(); }); return o; });
  }
  async function loadSheet(){
    if (!C.sheetCsvUrl) return;
    try {
      const res = await fetch(C.sheetCsvUrl + (C.sheetCsvUrl.includes("?") ? "&" : "?") + "t=" + Date.now(), { cache: "no-store" });
      if (!res.ok) throw new Error(res.status);
      const rows = parseCSV(await res.text()).filter(r => String(r.show || "yes").toLowerCase() !== "no");
      const ck = rows.find(r => r.type && r.type.toLowerCase() === "checkin" && r.media);
      if (ck && ck.media !== checkinUrl) { checkinUrl = ck.media; renderCheckin(); }
      const sc = rows.filter(r => r.type && r.type.toLowerCase() === "schedule").map(r => ({ name: r.title, days: r.weekly || r.days, start: r.start, end: r.end, place: r.place, calendar: r.calendar }));
      if (sc.length) { setSchedule(sc); lastKey = ""; renderNow(); }
      const sl = rows.filter(r => r.type && !["ticker","checkin","schedule"].includes(r.type.toLowerCase()));
      const tk = rows.filter(r => r.type && r.type.toLowerCase() === "ticker").map(r => r.title || r.body).filter(Boolean);
      if (sl.length) { slides = sl; store.set("lobby-sheet", { slides: sl, ticker: tk }); }
      if (tk.length) { tickerItems = tk; renderTicker(); }
    } catch(e) { console.warn("Sheet not reachable, using last saved content.", e); }
  }

  /* ---------- Controls ---------- */
  function fullscreen(){ const r = document.documentElement; if (!document.fullscreenElement && r.requestFullscreen) r.requestFullscreen().catch(() => {}); }
  document.addEventListener("click", fullscreen);
  document.addEventListener("keydown", e => {
    if (e.key === "f" || e.key === "F") fullscreen();
    else if (e.key === "ArrowRight") { paused = false; document.body.classList.remove("is-paused"); next(1); }
    else if (e.key === "ArrowLeft") { paused = false; document.body.classList.remove("is-paused"); next(-1); }
    else if (e.key === " ") { e.preventDefault(); paused = !paused; document.body.classList.toggle("is-paused", paused); if (paused) { clearTimeout(timer); prog.style.transition = "none"; } else next(1); }
  });
  let idleT; const wake = () => { document.body.classList.remove("idle"); clearTimeout(idleT); idleT = setTimeout(() => document.body.classList.add("idle"), 3000); };
  document.addEventListener("mousemove", wake); wake();
  setTimeout(() => $("hint").classList.add("gone"), 9000);
  document.addEventListener("fullscreenchange", () => $("hint").classList.add("gone"));

  /* keep the screen awake where supported */
  async function stayAwake(){ try { if (navigator.wakeLock) await navigator.wakeLock.request("screen"); } catch(e){} }
  stayAwake(); document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") stayAwake(); });

  /* go */
  loadSheet().finally(() => next(1));
  if (C.sheetCsvUrl) setInterval(loadSheet, (C.sheetRefreshMinutes || 5) * 60e3);
})();
</script>
</body>
